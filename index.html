<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lekhapora Rescue Mode</title>
    <!-- Load React 18 from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Load Babel for JSX support in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #764ba2;
            --primary-light: #667eea;
            --success: #10b981;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 40px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .icon-check {
            font-size: 64px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-weight: 800;
            font-size: 32px;
            color: var(--primary);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        .subheading {
            font-size: 18px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: #ecfdf5;
            color: var(--success);
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 30px;
            border: 1px solid #10b98133;
        }

        .info-card {
            background: #f9fafb;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
            border: 1px solid #e5e7eb;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .info-label {
            color: #6b7280;
            font-weight: 500;
        }

        .info-value {
            color: #111827;
            font-weight: 600;
            word-break: break-all;
            text-align: right;
            padding-left: 10px;
        }

        .interactive-section {
            padding: 24px;
            background: #f5f3ff;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .counter-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
        }

        button {
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            outline: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(118, 75, 162, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(118, 75, 162, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            background: white;
            color: #374151;
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.5;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "@capacitor/cli": "https://esm.sh/@capacitor/cli@^8.1.0",
    "webworker": "https://esm.sh/webworker@^0.8.4",
    "web-push": "https://esm.sh/web-push@^3.6.7"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [count, setCount] = useState(0);
            const [time, setTime] = useState(new Date().toLocaleTimeString());

            useEffect(() => {
                const timer = setInterval(() => {
                    setTime(new Date().toLocaleTimeString());
                }, 1000);
                console.log("✅ React App mounted successfully!");
                console.log("🟢 Single-file rescue mode active.");
                return () => clearInterval(timer);
            }, []);

            const handleAction = (feature) => {
                alert(`${feature} feature is coming soon! This page confirms your deployment is now working.`);
            };

            return (
                <div className="container">
                    <span className="icon-check">✅</span>
                    <h1>Lekhapora</h1>
                    <p className="subheading">Your HSC Study Tracker is WORKING!</p>
                    
                    <div className="status-badge">
                        Deployed Successfully
                    </div>

                    <div className="info-card">
                        <div className="info-row">
                            <span className="info-label">Environment</span>
                            <span className="info-value">Production (Rescue)</span>
                        </div>
                        <div className="info-row">
                            <span className="info-label">React Version</span>
                            <span className="info-value">18.3.1</span>
                        </div>
                        <div className="info-row">
                            <span className="info-label">Current Time</span>
                            <span className="info-value">{time}</span>
                        </div>
                        <div className="info-row">
                            <span className="info-label">URL</span>
                            <span className="info-value">{window.location.hostname}</span>
                        </div>
                    </div>

                    <div className="interactive-section">
                        <p className="counter-text">Interactive React Test</p>
                        <button 
                            className="btn-primary"
                            onClick={() => setCount(c => c + 1)}
                        >
                            Click to Test React: {count}
                        </button>
                        <p style={{fontSize: '11px', color: '#6b7280'}}>
                            If the number increases, React is functional.
                        </p>
                    </div>

                    <div className="button-grid">
                        <button className="btn-secondary" onClick={() => handleAction('Login')}>Login</button>
                        <button className="btn-secondary" onClick={() => handleAction('Dashboard')}>Dashboard</button>
                        <button className="btn-secondary" onClick={() => window.location.reload()}>Refresh</button>
                        <button className="btn-secondary" onClick={() => handleAction('Syllabus')}>Syllabus</button>
                    </div>

                    <footer>
                        This proves your GitHub connection and Vercel deployment are healthy.<br/>
                        You can now slowly re-introduce your source files.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
