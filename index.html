<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HSC Study Tracker</title>
    <link rel="icon" type="image/png" href="/app-icon.png">
    <link rel="apple-touch-icon" href="/app-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#5B7DBE">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                brand: {
                  bg: 'rgb(var(--brand-bg) / <alpha-value>)',
                  surface: 'rgb(var(--brand-surface) / <alpha-value>)',
                  primary: 'rgb(var(--brand-primary) / <alpha-value>)',
                  secondary: 'rgb(var(--brand-secondary) / <alpha-value>)',
                  'text-p': 'rgb(var(--brand-text-p) / <alpha-value>)',
                  'text-s': 'rgb(var(--brand-text-s) / <alpha-value>)',
                }
              },
              animation: {
                'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              }
            }
          }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
          --brand-bg: 246 248 245;
          --brand-primary: 91 125 190;
          --brand-secondary: 127 174 158;
          --brand-surface: 233 237 240;
          --brand-text-p: 47 52 55;
          --brand-text-s: 107 114 128;
        }
        .dark {
          --brand-bg: 14 22 36;
          --brand-primary: 95 179 162;
          --brand-secondary: 139 156 242;
          --brand-surface: 22 31 46;
          --brand-text-p: 227 232 239;
          --brand-text-s: 138 148 166;
        }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--brand-bg); font-family: 'Inter', sans-serif; }
        #root { height: 100dvh; display: flex; flex-direction: column; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .transition-all { transition-duration: 300ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        main { padding-bottom: calc(5rem + env(safe-area-inset-bottom)) !important; }
        @media (min-width: 768px) { main { padding-bottom: 2rem !important; } }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "framer-motion": "https://esm.sh/framer-motion@11.11.11?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@capacitor/cli": "https://esm.sh/@capacitor/cli@^8.0.2",
    "web-push": "https://esm.sh/web-push@^3.6.7"
  }
}
</script>
</head>
<body class="light">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      // Global PWA Installation handler
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredPrompt = e;
        // Dispatch custom event to notify React components
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
        console.debug('PWA Install Prompt available');
      });

      window.addEventListener('appinstalled', (evt) => {
        console.log('HSC Tracker was installed');
        window.deferredPrompt = null;
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Changed to .js to match typical build output and avoid 404
          const swUrl = '/service-worker.js';
          const isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          
          if (isSecure) {
            navigator.serviceWorker.register(swUrl)
              .then(registration => {
                console.debug('Service Worker registered successfully');
              })
              .catch(error => {
                console.warn('Service Worker registration failed:', error);
                // Fallback attempt for dev environment
                navigator.serviceWorker.register('/service-worker.ts', { type: 'module' })
                  .catch(e => {});
              });
          }
        });
      }
    </script>
</body>
</html>
