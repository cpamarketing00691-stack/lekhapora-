<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lekhapora - Smart HSC Preparation</title>
    
    <!-- PWA and Icons -->
    <link rel="icon" type="image/png" href="/app-icon.png">
    <link rel="apple-touch-icon" href="/app-icon.png">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Meta Tags -->
    <meta name="theme-color" content="#5B7DBE">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="A comprehensive study tracking application for Bangladesh HSC students.">
    
    <!-- Network Pre-hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://uycxbrcbweeuvizrgpnw.supabase.co">
    
    <!-- Critical Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <style>
      /* Fallback CSS Loader - Shows until React mounts */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #F6F8F5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #5B7DBE20;
        border-top: 4px solid #5B7DBE;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #timeout-message {
        display: none;
        margin-top: 20px;
        text-align: center;
        color: #ef4444;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.1em;
      }
    </style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "@capacitor/cli": "https://esm.sh/@capacitor/cli@^8.1.0",
    "webworker": "https://esm.sh/webworker@^0.8.4",
    "web-push": "https://esm.sh/web-push@^3.6.7",
    "tesseract.js": "https://esm.sh/tesseract.js@^5.0.5"
  }
}
</script>
</head>
<body class="light bg-brand-bg font-sans selection:bg-brand-primary/20">
    <!-- Initial Loader -->
    <div id="initial-loader">
        <div class="spinner"></div>
        <div id="timeout-message">Connection taking too long. Please refresh.</div>
    </div>

    <div id="root"></div>

    <script>
      // 10-second safety timeout to show error if React fails to mount
      setTimeout(() => {
        const msg = document.getElementById('timeout-message');
        if (msg) msg.style.display = 'block';
      }, 10000);

      // Global loader signal function
      window.markAppAsLoaded = () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      };
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
