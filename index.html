
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HSC Study Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                brand: {
                  bg: 'rgb(var(--brand-bg) / <alpha-value>)',
                  surface: 'rgb(var(--brand-surface) / <alpha-value>)',
                  primary: 'rgb(var(--brand-primary) / <alpha-value>)',
                  secondary: 'rgb(var(--brand-secondary) / <alpha-value>)',
                  'text-p': 'rgb(var(--brand-text-p) / <alpha-value>)',
                  'text-s': 'rgb(var(--brand-text-s) / <alpha-value>)',
                }
              }
            }
          }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- OneSignal Integration -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "60485ed0-3b0d-4d73-ba7f-a152676d14d2",
          safari_web_id: "web.onesignal.auto.108d8132-70b8-4c60-a549-b58607a7ec41",
          notifyButton: {
            enable: false,
          },
          allowLocalhostAsSecureOrigin: true,
        });
      });
    </script>

    <style>
        * {
          box-sizing: border-box;
          -webkit-tap-highlight-color: transparent;
        }
        
        :root {
          --brand-bg: 246 248 245;
          --brand-primary: 91 125 190;
          --brand-secondary: 127 174 158;
          --brand-surface: 233 237 240;
          --brand-text-p: 47 52 55;
          --brand-text-s: 107 114 128;
        }

        .dark {
          --brand-bg: 14 22 36;
          --brand-primary: 95 179 162;
          --brand-secondary: 139 156 242;
          --brand-surface: 27 38 54;
          --brand-text-p: 227 232 239;
          --brand-text-s: 138 148 166;
        }

        html, body {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background: var(--brand-bg);
          font-family: 'Inter', sans-serif;
        }

        #root {
          height: 100dvh;
          display: flex;
          flex-direction: column;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .transition-all { transition-duration: 300ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }

        @media (max-width: 640px) {
          .max-w-xl { max-width: 100% !important; }
          .p-10 { padding: 1.5rem !important; }
          .p-8 { padding: 1.25rem !important; }
          .p-6 { padding: 1rem !important; }
          .text-5xl { font-size: 2.5rem !important; }
          .text-4xl { font-size: 2rem !important; }
        }

        main {
          padding-bottom: calc(5rem + env(safe-area-inset-bottom)) !important;
        }

        @media (min-width: 768px) {
          main {
            padding-bottom: 2rem !important;
          }
        }

        .recharts-responsive-container {
          min-width: 0 !important;
        }

        .modal-content {
          max-height: calc(100dvh - 4rem);
          overflow-y: auto;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="light">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
