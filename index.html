
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HSC Study Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                brand: {
                  bg: 'rgb(var(--brand-bg) / <alpha-value>)',
                  surface: 'rgb(var(--brand-surface) / <alpha-value>)',
                  primary: 'rgb(var(--brand-primary) / <alpha-value>)',
                  secondary: 'rgb(var(--brand-secondary) / <alpha-value>)',
                  'text-p': 'rgb(var(--brand-text-p) / <alpha-value>)',
                  'text-s': 'rgb(var(--brand-text-s) / <alpha-value>)',
                }
              }
            }
          }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
          box-sizing: border-box;
          -webkit-tap-highlight-color: transparent;
        }
        
        :root {
          --brand-bg: 246 248 245;
          --brand-primary: 91 125 190;
          --brand-secondary: 127 174 158;
          --brand-surface: 233 237 240;
          --brand-text-p: 47 52 55;
          --brand-text-s: 107 114 128;
        }

        .dark {
          --brand-bg: 14 22 36;
          --brand-primary: 95 179 162;
          --brand-secondary: 139 156 242;
          --brand-surface: 27 38 54;
          --brand-text-p: 227 232 239;
          --brand-text-s: 138 148 166;
        }

        html, body {
          width: 100%;
          height: 100dvh;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background: var(--brand-bg);
          font-family: 'Inter', sans-serif;
        }

        #root {
          height: 100%;
          display: flex;
          flex-direction: column;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .transition-all { transition-duration: 300ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }

        /* Responsive Overrides - CSS ONLY */
        @media (max-width: 480px) {
          .max-w-xl { max-width: 100% !important; margin: 0 !important; border-radius: 1.5rem !important; }
          .p-10 { padding: 1.25rem !important; }
          .p-8 { padding: 1.15rem !important; }
          .p-6 { padding: 1rem !important; }
          .text-5xl { font-size: 2.75rem !important; }
          .text-4xl { font-size: 2.25rem !important; }
          
          /* Force fixed heights to be scrollable on small screens */
          .min-h-\[400px\] { 
            min-height: auto !important; 
            max-height: 60vh !important; 
            overflow-y: auto !important; 
            padding-right: 4px;
          }
          .h-\[450px\] { 
            height: auto !important; 
            max-height: 55vh !important; 
            overflow-y: auto !important; 
            padding-right: 4px;
          }

          /* Dashboard Grid Adjustments */
          .grid-cols-1.md\:grid-cols-2.lg\:grid-cols-3 {
            grid-template-columns: 1fr !important;
          }
        }

        /* Tablet Grid Logic Optimization */
        @media (min-width: 481px) and (max-width: 1024px) {
          .lg\:grid-cols-12 { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
          .lg\:col-span-8 { grid-column: span 6 / span 6 !important; }
          .lg\:col-span-4 { grid-column: span 6 / span 6 !important; }
          .lg\:grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
          
          /* Modal Sizing */
          .max-w-xl { max-width: 90% !important; }
        }

        /* Handle iOS Notch and Safe Areas */
        main {
          padding-top: env(safe-area-inset-top) !important;
          padding-bottom: calc(8.5rem + env(safe-area-inset-bottom)) !important;
        }
        nav {
          padding-bottom: env(safe-area-inset-bottom) !important;
        }

        /* Fix for Recharts responsiveness inside CSS grid */
        .recharts-responsive-container {
          min-width: 0 !important;
        }

        /* Smooth scrollbar for forced scrollable areas */
        .min-h-\[400px\]::-webkit-scrollbar,
        .h-\[450px\]::-webkit-scrollbar {
          width: 4px;
        }
        .min-h-\[400px\]::-webkit-scrollbar-thumb,
        .h-\[450px\]::-webkit-scrollbar-thumb {
          background: rgba(var(--brand-primary), 0.2);
          border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="light">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
