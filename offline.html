<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Lekhapora</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F6F8F5;
      color: #475255;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
      background: white;
      padding: 40px;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    }
    h1 { font-size: 64px; margin: 0 0 20px 0; }
    h2 { font-weight: 900; color: #5B7DBE; margin: 0 0 10px 0; }
    p { font-size: 16px; opacity: 0.7; margin-bottom: 30px; line-height: 1.5; }
    button {
      background: #5B7DBE;
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡</h1>
    <h2>অফলাইন মোড</h2>
    <p>আপনার ইন্টারনেট সংযোগ বিচ্ছিন্ন হয়ে গেছে। সংযোগ ফিরে এলে পুনরায় চেষ্টা করুন।</p>
    <button onclick="window.location.reload()">আবার চেষ্টা করুন</button>
  </div>
</body>
</html>
